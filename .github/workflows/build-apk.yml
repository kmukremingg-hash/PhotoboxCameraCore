name: Build PhotoboxCameraCore APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply WLAN connection fix
        run: python3 scripts/patch_v081.py

      - name: Apply integrated Fotobox 0.9 patch
        run: python3 scripts/patch_v090.py

      - name: Apply Fotobox 0.9.1 crop fix
        run: python3 scripts/patch_v091.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Collectooow-Fotobox-0.9.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
